<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<link rel="icon" href="data:,">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>词域探险 · 网页版 - Word Realm Roguelike</title>
<style>
  html, body {
    margin: 0; padding: 0; height: 100%; overflow: hidden;
    background: #0c0f14; color: #e8eef5;
    font-family: "Microsoft YaHei UI", "Microsoft YaHei", "PingFang SC", "Noto Sans SC", sans-serif;
    user-select: none;
  }
  #wrap {
    position: fixed; inset: 0;
    display: flex; align-items: center; justify-content: center;
  }
  canvas {
    background: #000;
    box-shadow: 0 0 60px rgba(0,0,0,0.8);
    image-rendering: auto;
    touch-action: none;
    cursor: crosshair;
  }
  #loading {
    position: fixed; inset: 0; z-index: 10;
    display: flex; flex-direction: column; gap: 14px;
    align-items: center; justify-content: center;
    background: #0c0f14; font-size: 18px; letter-spacing: 2px;
  }
  #loading .bar { width: 320px; height: 8px; background: #1d2633; border-radius: 4px; overflow: hidden; }
  #loading .fill { height: 100%; width: 0%; background: #58c7ff; transition: width .2s; }
  #hint {
    position: fixed; left: 12px; bottom: 8px; z-index: 5;
    font-size: 12px; color: #5d6a7a; letter-spacing: 1px;
  }
</style>
</head>
<body>
<div id="loading"><div>正在加载词库与素材…</div><div class="bar"><div class="fill" id="fill"></div></div><div id="loadText">0%</div></div>
<div id="wrap"><canvas id="game" width="1280" height="720"></canvas></div>
<div id="hint">操作：WASD 移动 · 鼠标瞄准 · 左键发射 · E 拾取/开箱 · Space 闪避 · Q 护盾药 · Tab 记忆书 · F11 全屏</div>
<script src="game.js"></script>
</body>
</html>

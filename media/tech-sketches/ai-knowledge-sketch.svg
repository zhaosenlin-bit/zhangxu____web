<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360">
  <defs>
    <linearGradient id="aiBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f1a35"/>
      <stop offset="1" stop-color="#1d3a6e"/>
    </linearGradient>
  </defs>
  <rect width="640" height="360" fill="url(#aiBg)"/>

  <!-- stars -->
  <g fill="#ffd86b">
    <circle cx="60" cy="40" r="1.5"/><circle cx="160" cy="60" r="1.5"/><circle cx="540" cy="80" r="1.5"/>
    <circle cx="580" cy="220" r="1.5"/><circle cx="80" cy="280" r="1.5"/><circle cx="500" cy="40" r="1.5"/>
  </g>

  <!-- network layers: input -->
  <g fill="none" stroke="#7ad9ff" stroke-width="2.5">
    <line x1="100" y1="100" x2="240" y2="120"/>
    <line x1="100" y1="100" x2="240" y2="180"/>
    <line x1="100" y1="100" x2="240" y2="240"/>
    <line x1="100" y1="180" x2="240" y2="120"/>
    <line x1="100" y1="180" x2="240" y2="180"/>
    <line x1="100" y1="180" x2="240" y2="240"/>
    <line x1="100" y1="260" x2="240" y2="120"/>
    <line x1="100" y1="260" x2="240" y2="180"/>
    <line x1="100" y1="260" x2="240" y2="240"/>
  </g>
  <g fill="#ffd86b" stroke="#1a1a1a" stroke-width="2">
    <circle cx="100" cy="100" r="14"/><circle cx="100" cy="180" r="14"/><circle cx="100" cy="260" r="14"/>
  </g>
  <text x="100" y="305" text-anchor="middle" font-family="'Courier New', monospace" font-size="12" fill="#a5c4ff">input</text>

  <!-- hidden layer -->
  <g fill="none" stroke="#7ad9ff" stroke-width="2.5">
    <line x1="240" y1="120" x2="400" y2="100"/>
    <line x1="240" y1="120" x2="400" y2="180"/>
    <line x1="240" y1="120" x2="400" y2="260"/>
    <line x1="240" y1="180" x2="400" y2="100"/>
    <line x1="240" y1="180" x2="400" y2="180"/>
    <line x1="240" y1="180" x2="400" y2="260"/>
    <line x1="240" y1="240" x2="400" y2="100"/>
    <line x1="240" y1="240" x2="400" y2="180"/>
    <line x1="240" y1="240" x2="400" y2="260"/>
  </g>
  <g fill="#ff5c8a" stroke="#fff" stroke-width="2">
    <circle cx="240" cy="120" r="14"/><circle cx="240" cy="180" r="14"/><circle cx="240" cy="240" r="14"/>
  </g>

  <!-- output layer -->
  <g fill="none" stroke="#7ad9ff" stroke-width="2.5">
    <line x1="400" y1="100" x2="540" y2="180"/>
    <line x1="400" y1="180" x2="540" y2="180"/>
    <line x1="400" y1="260" x2="540" y2="180"/>
  </g>
  <g fill="#a5e17c" stroke="#1a1a1a" stroke-width="2">
    <circle cx="400" cy="100" r="14"/><circle cx="400" cy="180" r="14"/><circle cx="400" cy="260" r="14"/>
  </g>
  <g fill="#ffd86b" stroke="#1a1a1a" stroke-width="3">
    <circle cx="540" cy="180" r="20"/>
  </g>
  <text x="540" y="184" text-anchor="middle" font-family="'Courier New', monospace" font-size="16" font-weight="700" fill="#1a1a1a">AI</text>
  <text x="540" y="230" text-anchor="middle" font-family="'Courier New', monospace" font-size="12" fill="#a5c4ff">output</text>

  <!-- title -->
  <text x="320" y="340" text-anchor="middle" font-family="'Comic Sans MS', cursive" font-size="22" font-weight="700" fill="#ffd86b">AI 互动课堂 · playground · lab · learning</text>
</svg>
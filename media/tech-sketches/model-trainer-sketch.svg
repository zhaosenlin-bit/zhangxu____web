<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360">
  <defs>
    <linearGradient id="mtBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a1830"/>
      <stop offset="1" stop-color="#163459"/>
    </linearGradient>
  </defs>
  <rect width="640" height="360" fill="url(#mtBg)"/>

  <!-- grid lines -->
  <g stroke="#1f4377" stroke-width="1" opacity="0.6">
    <line x1="0" y1="90" x2="640" y2="90"/>
    <line x1="0" y1="150" x2="640" y2="150"/>
    <line x1="0" y1="210" x2="640" y2="210"/>
    <line x1="0" y1="270" x2="640" y2="270"/>
    <line x1="160" y1="40" x2="160" y2="320"/>
    <line x1="320" y1="40" x2="320" y2="320"/>
    <line x1="480" y1="40" x2="480" y2="320"/>
  </g>

  <!-- title bar -->
  <text x="40" y="35" font-family="'Courier New', monospace" font-size="14" font-weight="700" fill="#7ad9ff">model.trainer · epoch 64/100 · loss 0.0142 · acc 0.984</text>

  <!-- accuracy chart (left) -->
  <g fill="none" stroke="#7ad9ff" stroke-width="3">
    <polyline points="60,260 100,230 140,180 180,160 220,120 260,100 300,90 340,85 380,80 420,78 460,75 500,73 540,72 580,70"/>
  </g>
  <g fill="#ffd86b">
    <circle cx="180" cy="160" r="4"/><circle cx="260" cy="100" r="4"/><circle cx="340" cy="85" r="4"/><circle cx="420" cy="78" r="4"/><circle cx="500" cy="73" r="4"/>
  </g>
  <text x="60" y="290" font-family="'Courier New', monospace" font-size="12" fill="#7ad9ff">accuracy</text>
  <text x="580" y="295" text-anchor="end" font-family="'Courier New', monospace" font-size="12" fill="#7ad9ff">0.98 ↑</text>

  <!-- loss chart (right) -->
  <g fill="none" stroke="#ff5c8a" stroke-width="3">
    <polyline points="60,80 100,110 140,150 180,170 220,210 260,225 300,240 340,250 380,255 420,260 460,263 500,265 540,268 580,270"/>
  </g>
  <text x="60" y="50" font-family="'Courier New', monospace" font-size="12" fill="#ff5c8a">loss</text>
  <text x="580" y="55" text-anchor="end" font-family="'Courier New', monospace" font-size="12" fill="#ff5c8a">0.014 ↓</text>

  <!-- bars at bottom showing progress -->
  <g>
    <rect x="60" y="300" width="50" height="14" rx="3" fill="#1f4377"/>
    <rect x="60" y="300" width="48" height="14" rx="3" fill="#7ad9ff"/>
    <rect x="120" y="300" width="50" height="14" rx="3" fill="#1f4377"/>
    <rect x="120" y="300" width="46" height="14" rx="3" fill="#a5e17c"/>
    <rect x="180" y="300" width="50" height="14" rx="3" fill="#1f4377"/>
    <rect x="180" y="300" width="50" height="14" rx="3" fill="#ff9248"/>
    <rect x="240" y="300" width="50" height="14" rx="3" fill="#1f4377"/>
    <rect x="240" y="300" width="42" height="14" rx="3" fill="#ff5c8a"/>
    <rect x="300" y="300" width="50" height="14" rx="3" fill="#1f4377"/>
    <rect x="300" y="300" width="50" height="14" rx="3" fill="#ffd86b"/>
  </g>

  <!-- neuron node -->
  <g transform="translate(420 130)">
    <circle r="50" fill="none" stroke="#7ad9ff" stroke-width="2"/>
    <circle r="30" fill="none" stroke="#ff5c8a" stroke-width="2"/>
    <circle r="10" fill="#ffd86b"/>
    <line x1="-50" y1="0" x2="-10" y2="0" stroke="#7ad9ff" stroke-width="2"/>
    <line x1="50" y1="0" x2="10" y2="0" stroke="#7ad9ff" stroke-width="2"/>
    <line x1="0" y1="-50" x2="0" y2="-10" stroke="#7ad9ff" stroke-width="2"/>
    <line x1="0" y1="50" x2="0" y2="10" stroke="#7ad9ff" stroke-width="2"/>
  </g>

  <text x="320" y="345" text-anchor="middle" font-family="'Comic Sans MS', cursive" font-size="20" font-weight="700" fill="#ffd86b">模型训练 · train · tune · ship</text>
</svg>
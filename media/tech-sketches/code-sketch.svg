<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360">
  <defs>
    <linearGradient id="codeBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d1b2a"/>
      <stop offset="1" stop-color="#142b48"/>
    </linearGradient>
  </defs>
  <rect width="640" height="360" fill="url(#codeBg)"/>

  <!-- editor window -->
  <rect x="40" y="40" width="560" height="240" rx="14" fill="#1a2845" stroke="#7ad9ff" stroke-width="3"/>
  <rect x="40" y="40" width="560" height="32" rx="14" fill="#0d1b2a"/>
  <circle cx="65" cy="56" r="5" fill="#ff5c8a"/>
  <circle cx="82" cy="56" r="5" fill="#ffd86b"/>
  <circle cx="99" cy="56" r="5" fill="#a5e17c"/>
  <text x="320" y="60" text-anchor="middle" font-family="'Courier New', monospace" font-size="11" fill="#7ad9ff">senlin.js · build · ship · iterate</text>

  <g font-family="'Courier New', monospace" font-size="18">
    <text x="60" y="115" fill="#a5c4ff">const</text>
    <text x="130" y="115" fill="#ffd86b"> zhao </text>
    <text x="200" y="115" fill="#ff5c8a">= {"{"}</text>

    <text x="80" y="145" fill="#7ad9ff">  name:</text>
    <text x="180" y="145" fill="#a5e17c">'森林 Senlin'</text>

    <text x="80" y="175" fill="#7ad9ff">  stack:</text>
    <text x="180" y="175" fill="#ff5c8a">[</text>
    <text x="195" y="175" fill="#a5e17c">'JS', 'Python', 'AI'</text>
    <text x="445" y="175" fill="#ff5c8a">]</text>

    <text x="80" y="205" fill="#7ad9ff">  build</text>
    <text x="160" y="205" fill="#ff9248">=&#62;</text>
    <text x="200" y="205" fill="#a5e17c">'ship &amp; iterate'</text>

    <text x="80" y="235" fill="#7ad9ff">  skills:</text>
    <text x="180" y="235" fill="#ffd86b">64</text>

    <text x="60" y="265" fill="#ff5c8a">{"}"}</text>
  </g>

  <!-- terminal -->
  <rect x="60" y="290" width="520" height="48" rx="8" fill="#ffd86b" stroke="#1a1a1a" stroke-width="2.5"/>
  <circle cx="80" cy="305" r="4" fill="#1a1a1a"/>
  <circle cx="95" cy="305" r="4" fill="#1a1a1a"/>
  <circle cx="110" cy="305" r="4" fill="#1a1a1a"/>
  <text x="320" y="320" text-anchor="middle" font-family="'Courier New', monospace" font-size="18" font-weight="700" fill="#1a1a1a">$ Forest.Senlin --run --forever</text>

  <text x="320" y="355" text-anchor="middle" font-family="'Comic Sans MS', cursive" font-size="12" fill="#7ad9ff">build · ship · iterate</text>
</svg>
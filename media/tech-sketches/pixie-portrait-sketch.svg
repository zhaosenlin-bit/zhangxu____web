<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360">
  <defs>
    <linearGradient id="bg1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fef7ed"/>
      <stop offset="1" stop-color="#fde2d4"/>
    </linearGradient>
  </defs>
  <rect width="640" height="360" fill="url(#bg1)"/>

  <!-- decorative dotted grid -->
  <g fill="#a5c4ff" opacity="0.45">
    <circle cx="50" cy="50" r="2.5"/><circle cx="100" cy="50" r="2.5"/><circle cx="590" cy="50" r="2.5"/>
    <circle cx="50" cy="310" r="2.5"/><circle cx="100" cy="310" r="2.5"/><circle cx="590" cy="310" r="2.5"/>
    <circle cx="50" cy="150" r="2.5"/><circle cx="50" cy="250" r="2.5"/>
    <circle cx="590" cy="150" r="2.5"/><circle cx="590" cy="250" r="2.5"/>
    <circle cx="200" cy="50" r="2.5"/><circle cx="440" cy="50" r="2.5"/>
    <circle cx="200" cy="310" r="2.5"/><circle cx="440" cy="310" r="2.5"/>
  </g>

  <!-- big circle behind head -->
  <circle cx="320" cy="170" r="130" fill="#ffd86b" opacity="0.45"/>
  <circle cx="320" cy="170" r="100" fill="#ff9248" opacity="0.35"/>

  <!-- shoulders / hoodie -->
  <path d="M160 340 Q190 250 260 235 L380 235 Q450 250 480 340 Z" fill="#7ad9ff" stroke="#1a1a1a" stroke-width="3.5" stroke-linejoin="round"/>
  <!-- hoodie pocket code tag -->
  <rect x="280" y="270" width="80" height="34" rx="8" fill="#fff" stroke="#1a1a1a" stroke-width="2.5"/>
  <text x="320" y="294" text-anchor="middle" font-family="'Courier New', monospace" font-size="18" font-weight="700" fill="#ff5c8a">&lt;/&gt;</text>

  <!-- neck -->
  <rect x="297" y="225" width="46" height="26" fill="#ffd9b8" stroke="#1a1a1a" stroke-width="2.5"/>

  <!-- head -->
  <circle cx="320" cy="180" r="70" fill="#ffe0c2" stroke="#1a1a1a" stroke-width="3.5"/>

  <!-- hair: messy coder bangs -->
  <path d="M255 150 Q260 100 320 100 Q385 100 385 155 Q365 125 330 130 Q305 110 280 130 Q265 120 255 150 Z" fill="#3a3a3a" stroke="#1a1a1a" stroke-width="2.5"/>

  <!-- earphones over head -->
  <path d="M242 168 Q242 105 320 105 Q398 105 398 168" fill="none" stroke="#1a1a1a" stroke-width="4"/>
  <rect x="234" y="160" width="16" height="28" rx="5" fill="#ff5c8a" stroke="#1a1a1a" stroke-width="2.5"/>
  <rect x="390" y="160" width="16" height="28" rx="5" fill="#ff5c8a" stroke="#1a1a1a" stroke-width="2.5"/>

  <!-- eyes -->
  <ellipse cx="298" cy="185" rx="6" ry="8" fill="#1a1a1a"/>
  <ellipse cx="342" cy="185" rx="6" ry="8" fill="#1a1a1a"/>
  <circle cx="296" cy="182" r="2" fill="#fff"/>
  <circle cx="340" cy="182" r="2" fill="#fff"/>

  <!-- blush -->
  <ellipse cx="282" cy="208" rx="9" ry="4" fill="#ff5c8a" opacity="0.45"/>
  <ellipse cx="358" cy="208" rx="9" ry="4" fill="#ff5c8a" opacity="0.45"/>

  <!-- mouth: gentle smile -->
  <path d="M302 213 Q320 228 338 213" fill="none" stroke="#1a1a1a" stroke-width="3" stroke-linecap="round"/>

  <!-- waving hand on right -->
  <g transform="translate(420 230) rotate(-15)">
    <rect x="-12" y="0" width="30" height="40" rx="10" fill="#7ad9ff" stroke="#1a1a1a" stroke-width="2.5"/>
    <circle cx="3" cy="-8" r="20" fill="#ffe0c2" stroke="#1a1a1a" stroke-width="2.5"/>
    <path d="M-9 -16 L-14 -22 M-2 -19 L-3 -28 M5 -19 L7 -28 M12 -16 L17 -22" stroke="#1a1a1a" stroke-width="2" stroke-linecap="round" fill="none"/>
  </g>

  <!-- floating code snippets around -->
  <g font-family="'Courier New', monospace" font-size="18" font-weight="700">
    <text x="70" y="120" fill="#ff5c8a">{"{"}</text>
    <text x="135" y="120" fill="#7ad9ff">{"}"}</text>
    <text x="60" y="200" fill="#a5c4ff">{"{"}</text>
    <text x="540" y="150" fill="#ff9248">=&#62;</text>
    <text x="540" y="270" fill="#ff5c8a">const</text>
    <text x="120" y="280" fill="#ff9248">fn</text>
  </g>

  <!-- speech bubble -->
  <g>
    <path d="M450 65 Q450 40 475 40 L580 40 Q605 40 605 65 L605 95 Q605 120 580 120 L515 120 L502 134 L505 120 L475 120 Q450 120 450 95 Z" fill="#fff" stroke="#1a1a1a" stroke-width="2.5"/>
    <text x="528" y="86" text-anchor="middle" font-family="'Comic Sans MS', cursive" font-size="16" font-weight="700" fill="#1a1a1a">Hi, I'm Senlin</text>
  </g>

  <!-- name plate -->
  <rect x="170" y="320" width="300" height="36" rx="8" fill="#1a1a1a"/>
  <text x="320" y="345" text-anchor="middle" font-family="'Comic Sans MS', cursive" font-size="20" font-weight="700" fill="#ffd86b">森林 · Senlin · 森林的猫</text>
</svg>
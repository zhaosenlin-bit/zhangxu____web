<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="chipGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7ad9ff"/>
      <stop offset="1" stop-color="#5fb8e0"/>
    </linearGradient>
  </defs>
  <rect width="256" height="256" fill="none"/>
  <!-- chip body -->
  <rect x="76" y="76" width="104" height="104" rx="8" fill="url(#chipGrad)" stroke="#1a1a1a" stroke-width="3"/>
  <!-- inner circuit -->
  <rect x="92" y="92" width="72" height="72" rx="4" fill="#0d1b2a" stroke="#1a1a1a" stroke-width="1.5"/>
  <!-- AI brain symbol -->
  <g transform="translate(128 128)">
    <path d="M-20 -10 Q-20 -22 -10 -22 L10 -22 Q20 -22 20 -10 L20 10 Q20 22 10 22 L-10 22 Q-20 22 -20 10 Z" fill="#ff5c8a" stroke="#1a1a1a" stroke-width="2"/>
    <path d="M-12 -8 Q-12 -14 -6 -14 L6 -14 Q12 -14 12 -8 L12 8 Q12 14 6 14 L-6 14 Q-12 14 -12 8 Z" fill="#ffd86b" stroke="#1a1a1a" stroke-width="1.5"/>
    <circle cx="-4" cy="-4" r="2" fill="#1a1a1a"/>
    <circle cx="4" cy="4" r="2" fill="#1a1a1a"/>
  </g>
  <!-- pins -->
  <g fill="#1a1a1a">
    <rect x="60" y="86" width="14" height="6" rx="1"/>
    <rect x="60" y="106" width="14" height="6" rx="1"/>
    <rect x="60" y="126" width="14" height="6" rx="1"/>
    <rect x="60" y="146" width="14" height="6" rx="1"/>
    <rect x="182" y="86" width="14" height="6" rx="1"/>
    <rect x="182" y="106" width="14" height="6" rx="1"/>
    <rect x="182" y="126" width="14" height="6" rx="1"/>
    <rect x="182" y="146" width="14" height="6" rx="1"/>
    <rect x="86" y="60" width="6" height="14" rx="1"/>
    <rect x="106" y="60" width="6" height="14" rx="1"/>
    <rect x="126" y="60" width="6" height="14" rx="1"/>
    <rect x="146" y="60" width="6" height="14" rx="1"/>
    <rect x="86" y="182" width="6" height="14" rx="1"/>
    <rect x="106" y="182" width="6" height="14" rx="1"/>
    <rect x="126" y="182" width="6" height="14" rx="1"/>
    <rect x="146" y="182" width="6" height="14" rx="1"/>
  </g>
  <!-- "AI" label -->
  <text x="128" y="220" text-anchor="middle" font-family="'Comic Sans MS', cursive" font-size="22" font-weight="700" fill="#1a1a1a">AI</text>
